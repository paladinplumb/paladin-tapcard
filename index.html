<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michael Welch - Paladin Plumbing</title>
<style>
  :root {
    --navy: #1b2333;
    --copper: #c1652f;
    --copper-light: #d97f4a;
    --cream: #f7f3ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, #2a3448 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--cream);
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(193,101,47,0.35);
    border-radius: 20px;
    padding: 40px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .logo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--copper);
    margin-bottom: 20px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .role {
    color: var(--copper-light);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
    margin-bottom: 4px;
  }
  .company {
    font-size: 16px;
    color: rgba(247,243,236,0.7);
    margin-bottom: 24px;
  }
  .status {
    font-size: 14px;
    color: rgba(247,243,236,0.6);
    margin-bottom: 18px;
    min-height: 20px;
    transition: opacity 0.3s;
  }
  .btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--copper) 0%, var(--copper-light) 100%);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(193,101,47,0.35);
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .info {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    color: rgba(247,243,236,0.75);
    line-height: 1.8;
  }
  .info a { color: var(--copper-light); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <img src="logo.png" alt="Paladin Plumbing" class="logo">
  <h1>Michael Welch</h1>
  <div class="role">Owner</div>
  <div class="company">Paladin Plumbing</div>

  <div class="status" id="status">Saving contact&hellip;</div>

  <a href="michael-welch.vcf" download="Michael-Welch-Paladin-Plumbing.vcf" id="save-btn" class="btn">
    Save Contact
  </a>

  <div class="info">
    Main: <a href="tel:8644773242">864-477-3242</a><br>
    Mobile: <a href="tel:8642611292">864-261-1292</a><br>
    <a href="https://paladinplumb.com">paladinplumb.com</a>
  </div>
</div>

<script>
  // Auto-trigger the save on load. The NFC tap itself counts as the
  // user gesture on most Android browsers, letting this fire instantly.
  // iOS Safari requires an explicit tap, so the visible button is the
  // fallback there and doubles as confirmation everywhere else.
  window.addEventListener('load', function () {
    setTimeout(function () {
      document.getElementById('save-btn').click();
      var status = document.getElementById('status');
      if (status) status.textContent = 'Tap "Save Contact" if it didn\'t open automatically';
    }, 600);
  });
</script>

</body>
</html>
